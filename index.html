
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Town Revival</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17232b;color:white;font-family:Arial,sans-serif}
header{text-align:center;background:linear-gradient(#344e5c,#203642);padding:15px;border-bottom:4px solid #e6ad50}
header h1{margin:0;color:#ffd16c;font-size:27px}
header p{margin:5px;color:#c4d1d9;letter-spacing:3px;font-size:11px}
.stats{display:flex;justify-content:space-around;background:#344b59;padding:14px;font-weight:bold}
nav{display:flex;overflow:auto;background:#152630}
nav button{flex:1;min-width:75px;border-radius:0;background:#263e4c;color:white;padding:14px 4px}
button{background:#f3ad35;color:#17242c;border:0;border-radius:8px;padding:11px;font-weight:bold}
button:disabled{opacity:.4}
button:active{transform:scale(.96)}
.page{padding:13px}
.hidden{display:none}
h2{color:#ffd16c}
#message{text-align:center;color:#ffda8a;padding:10px;min-height:38px}
.scene{
 position:relative;overflow:hidden;height:440px;
 border:5px solid #8d9994;border-radius:9px;
 background:linear-gradient(#62777a 0 20%,#87948a 20% 100%);
 box-shadow:inset 0 0 30px #172c2b;
}
.backwall{
 position:absolute;top:0;left:0;width:100%;height:90px;
 background:linear-gradient(#526f77,#344e57);
 border-bottom:9px solid #d0a65f;
 display:flex;align-items:center;justify-content:space-around;
 z-index:2;
}
.sign{background:#263b43;border:3px solid #eab44d;padding:10px;
 color:#ffd16c;font-weight:bold;letter-spacing:2px;box-shadow:0 3px 5px #17232b}
.window{width:43px;height:48px;background:linear-gradient(135deg,#c4f0ed,#4e8997);border:5px solid #304a55}
.floor{
 position:absolute;top:90px;bottom:0;width:100%;
 background-color:#87938a;
 background-image:
 linear-gradient(90deg,transparent 49%,#d4d1a5 50%,transparent 51%),
 linear-gradient(0deg,transparent 49%,#d4d1a5 50%,transparent 51%);
 background-size:90px 80px;
}
.floor:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(135deg,transparent 45%,#ffffff0c 50%,transparent 55%);
}
.parking{
 position:absolute;top:105px;left:5%;width:90%;height:265px;
 display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
 transform:perspective(650px) rotateX(48deg) rotateZ(-25deg) scale(.91);
 transform-origin:center center;
}
.slot{
 position:relative;border:2px dashed #eee2b5;
 background:linear-gradient(145deg,#667a70dd,#435c52dd);
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;min-width:0;overflow:hidden;
 box-shadow:inset 0 0 12px #263b35;
}
.slot:after{
 content:"PARKING";position:absolute;bottom:5px;
 color:#e6e4ce;font-size:8px;letter-spacing:2px;
}
.slot.selected{border:3px solid #ffbd42;background:#9a8955aa}
.slot .car-art{width:72%;max-height:90px;z-index:2;filter:drop-shadow(3px 5px 3px #17231f)}
.slot button{font-size:9px;padding:5px;margin-top:3px;z-index:3;max-width:95%;white-space:nowrap}
.empty{font-size:25px;z-index:2}
.workshop{
 position:absolute;bottom:0;left:0;width:100%;height:42px;
 background:linear-gradient(#465d59,#263d3c);
 border-top:5px solid #e4b25b;
 display:flex;justify-content:space-around;align-items:center;
 font-size:17px;z-index:4;
}
.workshop span{color:#ffdb91;font-weight:bold}
.panel{background:#293e4d;padding:16px;border-radius:10px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#344c5b;border:2px solid #536c78;border-radius:10px;padding:12px;text-align:center}
.card .car-art{width:100%;height:95px}
.card button{width:100%;margin-top:5px}
.small{font-size:12px;color:#c1cdd1}
.actions{display:flex;gap:8px}
.actions button{flex:1}
#upgradeEmoji{width:130px;height:110px;margin:auto}
footer{text-align:center;color:#9aabb1;padding:20px}
@media(max-width:380px){
 .scene{height:410px}
 .parking{top:105px;height:245px}
 .sign{font-size:12px;padding:8px}
}
</style>
</head>
<body>

<header>
<h1>🚗 CAR TOWN</h1>
<p>REVIVAL EDITION</p>
</header>

<div class="stats">
<span>💰 <b id="money">5000</b></span>
<span>⭐ <b id="level">1</b></span>
<span>🚘 <b id="count">1</b></span>
</div>

<nav>
<button onclick="show('garage')">🏠 Garage</button>
<button onclick="show('shop')">🛒 Shop</button>
<button onclick="show('work')">🔧 Workshop</button>
<button onclick="show('race')">🏁 Race</button>
</nav>

<div id="message">Welcome to Car Town!</div>

<section id="garage" class="page">
<h2>🏠 MY GARAGE</h2>
<div class="scene">
 <div class="backwall">
  <div class="window"></div>
  <div class="sign">CAR TOWN</div>
  <div class="window"></div>
 </div>
 <div class="floor"></div>
 <div class="parking" id="parking"></div>
 <div class="workshop">
  <span>🔧</span><span>🛞</span>
  <span>🧰 WORKSHOP</span><span>🛢️</span>
 </div>
</div>

<h2>🚘 MY COLLECTION</h2>
<div class="grid" id="collection"></div>
</section>

<section id="shop" class="page hidden">
<h2>🛒 CAR DEALERSHIP</h2>
<div class="grid" id="shopCars"></div>
</section>

<section id="work" class="page hidden">
<h2>🔧 WORKSHOP</h2>
<div class="panel" style="text-align:center">
 <div id="upgradeEmoji"></div>
 <h3 id="upgradeName">Starter Car</h3>
 <p>Engine Level: <b id="engine">1</b></p>
 <button onclick="upgradeCar()">UPGRADE ENGINE – 500</button>
</div>
<div class="panel">
 <h3>🎨 PAINT SHOP</h3>
 <div class="actions">
  <button onclick="paint('red')">RED</button>
  <button onclick="paint('blue')">BLUE</button>
  <button onclick="paint('gold')">GOLD</button>
 </div>
</div>
</section>

<section id="race" class="page hidden">
<h2>🏁 RACE TRACK</h2>
<div class="panel" style="text-align:center">
 <div style="font-size:75px">🏎️ 🏁 🏎️</div>
 <h3>STREET RACE</h3>
 <p>Win coins and increase your level!</p>
 <button onclick="race()">START RACE</button>
</div>
</section>

<footer>CAR TOWN REVIVAL © 2026</footer>

<script>
const catalog=[
 {name:"Starter Car",emoji:"🏎️",price:0,paint:"#e5e5df"},
 {name:"City Sport",emoji:"🚗",price:2000,paint:"#d93636"},
 {name:"Supercar",emoji:"🏎️",price:5000,paint:"#2468c5"},
 {name:"Luxury Coupe",emoji:"🚘",price:8000,paint:"#202b38"},
 {name:"Racing Beast",emoji:"🏎️",price:12000,paint:"#e8c04d"},
 {name:"Classic Car",emoji:"🚙",price:3500,paint:"#478a58"},
 {name:"McLaren Orange",emoji:"🏎️",price:15000,paint:"#f47721"},
 {name:"Blue Racer",emoji:"🚘",price:11000,paint:"#2385d8"},
 {name:"Vintage Sport",emoji:"🚗",price:6500,paint:"#a84b43"}
];

let saved;
try{saved=JSON.parse(localStorage.getItem("cartown"))}catch(e){}
let state=saved||{
 money:5000,level:1,selected:0,
 cars:[{id:0,engine:1,color:"white"}]
};

if(!Array.isArray(state.cars)||!state.cars.length){
 state.cars=[{id:0,engine:1,color:"white"}];
 state.selected=0;
}
state.selected=Math.max(0,Math.min(state.selected||0,state.cars.length-1));

function current(){return state.cars[state.selected]}
function msg(t){document.getElementById("message").textContent=t}

function carArt(id,color){
 let model=catalog[id]||catalog[0];
 let colors={
  white:"#e5e5df",red:"#d93636",blue:"#2468c5",gold:"#d9ad38"
 };
 let body=colors[color]||model.paint;
 let accent=id===6?"#168ed0":"#f3f0df";
 return `<svg class="car-art" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
 <ellipse cx="50" cy="78" rx="39" ry="65" fill="#17231f" opacity=".35"/>
 <rect x="10" y="31" width="12" height="30" rx="5" fill="#171b20"/>
 <rect x="78" y="31" width="12" height="30" rx="5" fill="#171b20"/>
 <rect x="10" y="91" width="12" height="30" rx="5" fill="#171b20"/>
 <rect x="78" y="91" width="12" height="30" rx="5" fill="#171b20"/>
 <path d="M28 10 Q50 0 72 10 L84 35 L88 112 Q84 137 50 143 Q16 137 12 112 L16 35Z" fill="${body}" stroke="#202a2d" stroke-width="3"/>
 <path d="M27 20 Q50 12 73 20 L78 48 L22 48Z" fill="#263d4a" stroke="#a8d8e2" stroke-width="2"/>
 <path d="M22 54 L78 54 L75 91 L25 91Z" fill="#314c59" stroke="#b4dce0" stroke-width="2"/>
 <path d="M25 97 L75 97 L70 119 Q50 130 30 119Z" fill="#263d4a" stroke="#a8d8e2" stroke-width="2"/>
 <path d="M17 35 L25 30 L25 43 L17 47Z" fill="#fff1b1"/>
 <path d="M83 35 L75 30 L75 43 L83 47Z" fill="#fff1b1"/>
 <path d="M17 111 L25 115 L25 123 L17 120Z" fill="#ef4d3c"/>
 <path d="M83 111 L75 115 L75 123 L83 120Z" fill="#ef4d3c"/>
 <path d="M45 7 L55 7 L55 140 L45 140Z" fill="${accent}" opacity="${id===6?".9":".12"}"/>
 <path d="M30 12 Q50 5 70 12" fill="none" stroke="#ffffff" stroke-width="2" opacity=".55"/>
 </svg>`;
}

function save(){
 localStorage.setItem("cartown",JSON.stringify(state));
 update();
}

function update(){
 document.getElementById("money").textContent=state.money;
 document.getElementById("level").textContent=state.level;
 document.getElementById("count").textContent=state.cars.length;
}

function show(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 render();
}

function render(){
 if(!current())return;
 let c=current(),model=catalog[c.id]||catalog[0];
 document.getElementById("upgradeName").textContent=model.name;
 document.getElementById("upgradeEmoji").innerHTML=carArt(c.id,c.color);
 document.getElementById("engine").textContent=c.engine;

 document.getElementById("parking").innerHTML=
 Array.from({length:9},(_,i)=>{
  let car=state.cars[i];
  return `<div class="slot ${i===state.selected?'selected':''}">
  ${car?`${carArt(car.id,car.color)}
  <button onclick="selectCar(${i})">${catalog[car.id].name}</button>`
  :`<div class="empty">🅿️</div><span class="small">EMPTY</span>`}
  </div>`;
 }).join("");

 document.getElementById("collection").innerHTML=
 state.cars.map((car,i)=>`
 <div class="card">
  ${carArt(car.id,car.color)}
  <b>${catalog[car.id].name}</b>
  <p class="small">Engine Level ${car.engine}</p>
  <button onclick="selectCar(${i})">${i===state.selected?"SELECTED":"SELECT"}</button>
 </div>`).join("");

 document.getElementById("shopCars").innerHTML=
 catalog.slice(1).map(car=>{
  let id=catalog.indexOf(car);
  let owned=state.cars.some(c=>c.id===id);
  return `<div class="card">
   ${carArt(id,"white")}
   <b>${car.name}</b>
   <p>💰 ${car.price.toLocaleString()}</p>
   <button ${owned?"disabled":""} onclick="buy(${id})">
    ${owned?"OWNED":"BUY CAR"}
   </button>
  </div>`;
 }).join("");
 update();
}

function selectCar(i){
 state.selected=i;save();render();msg("Car selected!");
}

function buy(id){
 let car=catalog[id];
 if(state.cars.some(c=>c.id===id)){msg("Already owned!");return}
 if(state.cars.length>=9){msg("Your garage is full!");return}
 if(state.money<car.price){msg("Not enough coins!");return}
 state.money-=car.price;
 state.cars.push({id,engine:1,color:"white"});
 state.selected=state.cars.length-1;
 save();render();msg(car.name+" purchased!");
}

function upgradeCar(){
 if(state.money<500){msg("Not enough coins!");return}
 state.money-=500;current().engine++;
 if(current().engine%3===0)state.level++;
 save();render();msg("Engine upgraded!");
}

function paint(color){
 if(state.money<200){msg("Need 200 coins!");return}
 state.money-=200;current().color=color;
 save();render();msg("New paint: "+color);
}

function race(){
 let reward=Math.floor(200+Math.random()*501);
 state.money+=reward;
 if(reward>550)state.level++;
 save();msg("🏁 You won "+reward+" coins!");
}

render();
</script>
</body>
</html>
